name: Python CI - Lint, Unit Tests & Docker Build Check

on:
  push:
    paths:
      - "cicd/assignment-1/**"
      - ".github/workflows/python-ci.yaml"
  pull_request:
    paths:
      - "cicd/assignment-1/**"
      - ".github/workflows/python-ci.yaml"

defaults:
  run:
    working-directory: cicd/assignment-1

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Run flake8
        run: flake8 . --max-line-length=100

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Notify of success
        if: success()
        run: echo "Tests passed on Python ${{ matrix.python-version }}"

  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hello-ci-check .

      - name: Run container
        run: docker run --rm hello-ci-check
