apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "irumf05@gmail.com"
    privateKeySecretRef:
      name: issuer
    solvers:
    - dns01:
        route53:
          hostedZoneID: Z032005233WJUVEBKTUGW
          region: ap-south-1
      selector:
        dnsZones:
        - "lab.irum.dev"
    - http01:
        ingress:
          class: nginx